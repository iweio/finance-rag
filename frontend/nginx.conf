# 前端容器自己的 nginx：只负责 SPA 静态文件 + history 路由 fallback。
# 对外反代（/ → frontend，/api → backend）由仓库根 nginx.conf 负责，这里不掺和。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，避免发版后用户拿到旧 index
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback：/clause/xxx、/history 这类前端路由刷新时回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
