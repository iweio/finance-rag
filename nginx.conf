# 根 nginx：/ → 前端容器（SPA），/api → 后端:8000（SSE 不缓冲）
#
# v1 的 `location / { return 404; }` 已删除 —— 那是「前端还没构建」的临时状态，
# 现在 frontend 服务是 compose 的第 7 个服务。nginx 自己的健康检查也不再用 `/`
# （404 会让容器永远 unhealthy），改用 /nginx-health。

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # 容器健康检查专用：不碰后端、不碰前端，纯本机返回
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # 兼容 v1 的 /health 入口（DEPLOY.md §5 的 curl 自检）
    location = /health {
        proxy_pass http://backend:8000/api/v1/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 三件套：少了 Connection "" 有些 nginx 版本会走 HTTP/1.0 上游、把流切碎
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
